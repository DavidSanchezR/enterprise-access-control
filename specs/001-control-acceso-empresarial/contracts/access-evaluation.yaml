openapi: 3.0.3
info:
  title: Control de Acceso Empresarial — Evaluación de Acceso
  version: "1.0.0"
  description: >
    Evalúa si una persona tiene acceso concedido a un área en una fecha/hora dada, aplicando el flujo de
    15 pasos de Historia 8 (RF-023 a RF-025, RF-059, RF-066; Sesión 2026-09-20, D4, research.md §30 —
    amplía el flujo de 14 a 15 pasos exigiendo además que la Compañía Principal propietaria del área y la
    compañía de pertenencia vigente de la persona estén ACTIVAS) con precedencia PERSONA > UNIDAD_ORGANIZATIVA >
    COMPAÑÍA y denegación por defecto (Principio I). El flujo determina primero la Compañía Principal
    propietaria del área, verifica que esté ACTIVA, y exige un contexto operativo vigente entre la persona y
    esa Principal (y, si la persona es de una Contratista, una relación Contratista→Principal vigente, y que
    la compañía de pertenencia vigente de la persona también esté ACTIVA) ANTES de evaluar cualquier
    permiso — un permiso de la Principal B nunca puede satisfacer una evaluación sobre un área de la
    Principal A (CS-018). Además, DEBE existir una AsignaciónCredencial vigente para esa misma Principal
    (RF-066, RF-070, RF-071): sin ella, el acceso se deniega aunque el resto de las reglas se cumplan — la
    credencial es condición necesaria, no suficiente. "Vigente" es la conjunción de Estado = ASIGNADO Y
    FechaHoraInicio <= fecha evaluada <= FechaHoraFin (fechaHoraFin es obligatoria desde RF-071, ya no
    existe la rama IS NULL); una credencial ASIGNADO cuya FechaHoraFin ya pasó está temporalmente expirada
    y deniega el acceso, sin que
    el sistema le cambie el Estado por ese solo hecho (research.md §24). Objetivo de performance: p95 <
    500 ms (CS-003). Una persona de una Compañía Contratista puede obtener CONCEDIDO sobre un área
    administrada por la Compañía Principal a la que presta servicios, siempre que tenga contexto operativo
    vigente con ella, credencial vigente con ella, y cumpla el resto de las reglas (Historia 8). Cuando
    finaliza la pertenencia de una persona a su compañía, el sistema revoca
    automáticamente (escritura en cascada, no solo en esta evaluación) los contextos, asignaciones de
    unidad organizativa y credenciales dependientes (RF-061 a RF-064, ver contracts/people.yaml y
    contracts/credentials.yaml); esta evaluación, además, sigue re-validando dinámicamente la legitimidad de
    cada contexto operativo contra la compañía de pertenencia vigente de la persona en la fecha evaluada
    como defensa adicional, no como sustituto de esa revocación (RF-065, research.md §7 paso 6, §14), y
    consulta directamente el Estado ya escrito por esa misma cascada para el gate de credencial (paso 7).
tags:
  - name: EvaluacionAcceso
paths:
  /api/evaluacion-acceso:
    post:
      tags: [EvaluacionAcceso]
      summary: Evaluar si una persona tiene acceso concedido a un área en una fecha/hora dada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluarAccesoRequest" }
      responses:
        "200":
          description: Resultado de la evaluación (siempre 200; el resultado CONCEDIDO/DENEGADO va en el cuerpo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluarAccesoResponse" }
        "404":
          description: Persona o área no encontrada, o fuera del alcance del usuario autenticado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EvaluarAccesoRequest:
      type: object
      required: [personaId, areaAccesoId, fechaHora]
      properties:
        personaId: { type: string, format: uuid }
        areaAccesoId: { type: string, format: uuid }
        fechaHora:
          type: string
          format: date-time
          description: >
            Instante UTC a evaluar; se convierte a la zona horaria IANA de la Compañía Principal
            propietaria del área para bloques horarios (Sesión 2026-09-20, D5, research.md §31) — ya no
            una zona única del sistema para todas las compañías.
    ResultadoEvaluacion:
      type: string
      enum: [CONCEDIDO, DENEGADO]
    MotivoDenegacion:
      type: string
      enum:
        - PERSONA_NO_ENCONTRADA
        - AREA_NO_ENCONTRADA
        - FUERA_DE_ALCANCE_USUARIO
        - SIN_CONTEXTO_OPERATIVO_VIGENTE
        - RELACION_CONTRATISTA_PRINCIPAL_VENCIDA
        - SIN_CREDENCIAL_VIGENTE
        - COMPANIA_INACTIVA
        - AREA_INACTIVA
        - PERFIL_NO_AUTORIZADO_EN_AREA
        - SIN_PERMISO_APLICABLE
        - PERMISO_FUERA_DE_VIGENCIA
        - FUERA_DE_BLOQUE_HORARIO
      description: >
        SIN_CONTEXTO_OPERATIVO_VIGENTE reemplaza al antiguo SIN_COMPANIA_VIGENTE (research.md §7, paso 6):
        la persona no tiene un ContextoOperativoPersonaPrincipal vigente con la Principal propietaria del
        área, o tiene uno pero ya no es legítimo porque su compañía de pertenencia vigente cambió (RF-061)
        — ambos casos se reportan con este mismo motivo, sin distinguirse en la respuesta.
        RELACION_CONTRATISTA_PRINCIPAL_VENCIDA aplica cuando la persona es de una Contratista y la
        RelaciónContratistaPrincipal correspondiente no está vigente en la fecha evaluada (RF-059).
        SIN_CREDENCIAL_VIGENTE (RF-066, RF-070, research.md §7 paso 7 y §24) cubre por igual: la persona
        nunca tuvo una AsignacionCredencial para esa Principal; la más reciente está en Estado DEVUELTO,
        ELIMINADO o REVOCADA; o está en Estado ASIGNADO pero temporalmente expirada (FechaHoraFin ya pasado
        respecto a la fecha evaluada, sin que ello cambie su Estado) — los cuatro casos se reportan con este
        mismo motivo, sin distinguirse en la respuesta (mismo patrón que SIN_CONTEXTO_OPERATIVO_VIGENTE); el
        detalle específico puede comunicarse en ProblemDetails.detail cuando la evaluación se exponga a
        través de ese formato. COMPANIA_INACTIVA (Sesión 2026-09-20, D4, research.md §30) cubre por igual:
        la Compañía Principal propietaria del área tiene Estado = INACTIVO, o la compañía de pertenencia
        vigente de la persona tiene Estado = INACTIVO — ambos casos se reportan con este mismo motivo, sin
        distinguirse en la respuesta (mismo patrón); el efecto es dinámico y reversible, sin ninguna
        escritura sobre registros dependientes.
    EvaluarAccesoResponse:
      type: object
      properties:
        resultado: { $ref: "#/components/schemas/ResultadoEvaluacion" }
        motivoDenegacion:
          $ref: "#/components/schemas/MotivoDenegacion"
          nullable: true
        companiaPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: Compañía Principal propietaria del área evaluada (paso 4 del algoritmo), presente aun si el resultado es DENEGADO
        contextoOperativoId:
          type: string
          format: uuid
          nullable: true
          description: Contexto operativo usado en la evaluación, si existía uno vigente con esa Principal
        permisoAplicadoId:
          type: string
          format: uuid
          nullable: true
          description: Presente solo si resultado = CONCEDIDO; identifica el PermisoAcceso que ganó por precedencia
        nivelAplicado:
          type: string
          enum: [PERSONA, UNIDAD_ORGANIZATIVA, COMPANIA]
          nullable: true
        evaluadoEnZonaHoraria:
          type: string
          example: America/Lima
          description: >
            Zona IANA de la Compañía Principal propietaria del área (D5, research.md §31); si no fue
            resoluble a una Principal (p. ej. DENEGADO antes del paso 4), se usa la zona de repaldo del
            sistema (ZonaHoraria:TimeZoneId).
    ProblemDetails:
      type: object
      description: >
        RFC 7807/9457 (research.md §21). Único formato de error HTTP del sistema; reemplaza el
        antiguo ErrorResponse propio. "codigo" es una extensión propia (ProblemDetails.Extensions):
        código de error de negocio estable y legible por máquina, para que el frontend distinga
        casos sin parsear "detail" (texto para humanos).
      properties:
        type: { type: string, format: uri, example: "https://tools.ietf.org/html/rfc9457" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        codigo: { type: string, description: "Extensión propia: código de error de negocio estable" }
security:
  - bearerAuth: []
