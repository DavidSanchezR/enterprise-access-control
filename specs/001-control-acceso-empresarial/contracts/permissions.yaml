openapi: 3.0.3
info:
  title: Control de Acceso Empresarial — Permisos de Acceso
  version: "2.0.0"
  description: >
    Permisos de acceso por persona, unidad organizativa o compañía, con vigencia y bloques horarios
    (Historia 8, RF-020, RF-021, RF-022, RF-039). Cuando alcance = COMPANIA, companiaId puede referenciar
    una compañía PRINCIPAL_MANDANTE o CONTRATISTA indistintamente (research.md §12) — p. ej. otorgar acceso
    a todo el personal de una Compañía Contratista sobre un área administrada por la Compañía Principal a
    la que presta servicios es un caso válido, pero solo produce acceso efectivo para las personas de esa
    Contratista que además tengan un contexto operativo vigente con esa Principal (ver
    contracts/access-evaluation.yaml, RF-059). Las operaciones de creación/actualización quedan limitadas
    al alcance de compañías del usuario autenticado, evaluado contra el companiaPrincipalId del área de
    acceso referenciada (RF-049). v1.1.0 (cambio post-Baseline VF-007, RF-082): con alcance = PERSONA, la
    vigencia DEBE quedar contenida en la pertenencia vigente de la persona cuando el permiso resultante
    queda ACTIVO y se crea, cambia sus fechas o pasa de INACTIVO a ACTIVO. No se valida al crear en estado
    INACTIVO, al cambiar solo bloques horarios ni al desactivar. No aplica a UNIDAD_ORGANIZATIVA ni COMPANIA.
    Antes de consultar la pertenencia se exige el alcance histórico del usuario sobre la persona (404 si
    está fuera). Sin cambios de esquema.
    v2.0.0 (cambio post-Baseline VF-004, RF-083; INCOMPATIBLE con v1.x en la petición): la vigencia se
    expresa como dos fechas civiles sin hora, cada una un día completo en la zona horaria de la Compañía
    Principal propietaria del área. La petición sustituye fechaHoraInicioVigencia/fechaHoraFinVigencia
    (date-time) por fechaInicioVigencia/fechaFinVigencia (date). La respuesta conserva los instantes UTC
    efectivos y añade las fechas civiles, vigenciaEnDiasCompletos y zonaHorariaIana. Los permisos creados
    antes de v2.0.0 conservan sus instantes. Al actualizar, cada extremo cuya fecha civil no cambia conserva
    su instante almacenado. Con alcance = PERSONA, la contención de RF-082 se compara por fecha civil.
    Detalle técnico: research.md §36.
tags:
  - name: Permisos
paths:
  /api/permisos:
    get:
      tags: [Permisos]
      summary: Listar permisos aplicables a un área, persona, unidad organizativa o compañía
      parameters:
        - name: areaAccesoId
          in: query
          schema: { type: string, format: uuid }
        - name: personaId
          in: query
          schema: { type: string, format: uuid }
        - name: unidadOrganizativaId
          in: query
          schema: { type: string, format: uuid }
        - name: companiaId
          in: query
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          schema: { type: string, enum: [ACTIVO, INACTIVO] }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamañoPagina
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Página de permisos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaPermisos" }
    post:
      tags: [Permisos]
      summary: Crear permiso de acceso con sus bloques horarios (RF-020, RF-021, RF-022)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermisoAccesoRequest" }
      responses:
        "201":
          description: Permiso creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermisoAcceso" }
        "400":
          description: >
            Vigencia inválida (fecha de fin anterior a la de inicio; la misma fecha es válida — RF-083),
            fecha ausente o con formato distinto de AAAA-MM-DD, bloque horario inválido (fin ≤ inicio) o bloques
            solapados dentro del mismo día (RF-039); o, con alcance = PERSONA y cuando el permiso resultante
            queda ACTIVO, la persona no tiene compañía de pertenencia vigente (codigo SIN_PERTENENCIA_VIGENTE,
            RF-082). Un alta con estado INACTIVO no consulta la pertenencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: >
            Área de acceso fuera del alcance del usuario (RF-049); o, con alcance = PERSONA y cuando el permiso
            resultante queda ACTIVO, persona fuera del alcance histórico del usuario (codigo
            RECURSO_NO_ENCONTRADO). El alcance se evalúa antes de consultar la pertenencia, de modo que una
            persona fuera de alcance nunca produce SIN_PERTENENCIA_VIGENTE ni FUERA_DE_CONTENCION_TEMPORAL
            (Principio I; research.md §35.6)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >
            Con alcance = PERSONA y cuando el permiso resultante queda ACTIVO, la vigencia excede la de la
            AsignacionCompania vigente de la persona, comparando fechas civiles (codigo
            FUERA_DE_CONTENCION_TEMPORAL, RF-082, RF-083)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/permisos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Permisos]
      summary: Obtener permiso por ID
      responses:
        "200":
          description: Permiso encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermisoAcceso" }
        "404":
          description: No encontrado
    put:
      tags: [Permisos]
      summary: Actualizar vigencia, estado y bloques horarios del permiso
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermisoAccesoRequest" }
      responses:
        "200":
          description: Permiso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermisoAcceso" }
        "400":
          description: >
            Vigencia o bloques horarios inválidos (RF-039, RF-083); alcance distinto del almacenado; o, con
            alcance = PERSONA, si la operación requiere contención (el permiso resultante queda ACTIVO y cambia
            la fecha civil de algún extremo o pasa de INACTIVO a ACTIVO), la persona no tiene compañía de
            pertenencia vigente (codigo SIN_PERTENENCIA_VIGENTE, RF-082)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: >
            Permiso inexistente o fuera del alcance del usuario (RF-049); o, con alcance = PERSONA y la
            operación sujeta a contención, persona fuera del alcance histórico del usuario (codigo
            RECURSO_NO_ENCONTRADO). El alcance se evalúa antes de consultar la pertenencia (Principio I;
            research.md §35.6)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >
            Con alcance = PERSONA y la operación sujeta a contención, la vigencia resultante excede la de la
            AsignacionCompania vigente de la persona, comparando fechas civiles (codigo
            FUERA_DE_CONTENCION_TEMPORAL, RF-082, RF-083). Cambiar
            solo los bloques horarios o desactivar nunca produce este error, aunque la vigencia almacenada
            exceda la pertenencia (registros anteriores a RF-082, CS-043)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AlcancePermiso:
      type: string
      enum: [PERSONA, UNIDAD_ORGANIZATIVA, COMPANIA]
    DiaSemana:
      type: string
      enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO]
    BloqueHorario:
      type: object
      required: [diaSemana, horaInicio, horaFin]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        diaSemana: { $ref: "#/components/schemas/DiaSemana" }
        horaInicio:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: >
            Hora local en la zona horaria de la Compañía Principal propietaria del área del permiso
            (Compania.zonaHorariaIana — RF-080, Sesión 2026-09-20), formato HH:mm. Antes de esa sesión el
            sistema interpretaba estas horas en America/Lima de forma fija para todas las compañías.
        horaFin:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: >
            Hora local en la zona horaria de la Compañía Principal propietaria del área del permiso
            (RF-080), formato HH:mm; debe ser posterior a horaInicio.
    PermisoAcceso:
      type: object
      properties:
        id: { type: string, format: uuid }
        areaAccesoId: { type: string, format: uuid }
        alcance: { $ref: "#/components/schemas/AlcancePermiso" }
        personaId: { type: string, format: uuid, nullable: true }
        unidadOrganizativaId: { type: string, format: uuid, nullable: true }
        companiaId: { type: string, format: uuid, nullable: true }
        fechaHoraInicioVigencia:
          type: string
          format: date-time
          description: >
            Instante UTC efectivo de inicio, el que evalúa el paso 12 (inicio <= instante < fin). Desde v2.0.0
            es de solo lectura: se calcula a partir de fechaInicioVigencia (primer instante válido del día en
            zonaHorariaIana, RF-083) o se conserva el almacenado (permisos anteriores o extremo sin cambios).
        fechaHoraFinVigencia:
          type: string
          format: date-time
          description: >
            Instante UTC efectivo de fin (primer instante válido del día siguiente a fechaFinVigencia menos
            1 ms, o el almacenado). Obligatoria (RF-021 ya lo exigía desde el spec original; corregido en la
            Sesión 2026-09-14 "vigencia temporal jerárquica" — RF-071 — que antes se documentaba
            incorrectamente como nullable). Aplica a los tres valores de alcance. Con alcance = PERSONA,
            sujeta a contención respecto a la AsignacionCompania vigente según RF-082 (hasta v1.0.0 no lo
            estaba), comparada por fecha civil desde v2.0.0; los permisos existentes conservan sus fechas.
            UNIDAD_ORGANIZATIVA y COMPANIA no están sujetos a contención.
        fechaInicioVigencia:
          type: string
          format: date
          description: >
            Fecha civil de inicio (v2.0.0, RF-083): fecha local de fechaHoraInicioVigencia en zonaHorariaIana.
            Se recalcula en cada lectura con la zona actual de la Principal (RF-080, F-7).
        fechaFinVigencia:
          type: string
          format: date
          description: >
            Fecha civil de fin (v2.0.0, RF-083): fecha local de fechaHoraFinVigencia en zonaHorariaIana.
        vigenciaEnDiasCompletos:
          type: boolean
          description: >
            true si ambos instantes coinciden exactamente con los límites de día de sus fechas civiles en
            zonaHorariaIana; la vigencia se presenta entonces solo con fechas. false en permisos anteriores a
            v2.0.0 con hora (o tras un cambio de zona): se presenta con fecha y hora (RF-083 (f)).
        zonaHorariaIana:
          type: string
          description: >
            Zona efectiva de la Compañía Principal propietaria del área (la suya o la global de respaldo, igual
            que en el paso 13) con la que se calcularon las fechas civiles.
        estado: { type: string, enum: [ACTIVO, INACTIVO] }
        bloquesHorarios:
          type: array
          items: { $ref: "#/components/schemas/BloqueHorario" }
    PermisoAccesoRequest:
      type: object
      required: [areaAccesoId, alcance, fechaInicioVigencia, fechaFinVigencia, estado, bloquesHorarios]
      description: >
        Exactamente uno de personaId, unidadOrganizativaId, companiaId debe informarse, coincidiendo
        con el valor de alcance. fechaFinVigencia es obligatoria (RF-021, RF-071) para los tres alcances.
        v2.0.0 (RF-083): las fechas de vigencia son fechas civiles sin hora; los campos date-time de v1.x ya
        no se aceptan en la petición. Al actualizar, un extremo cuya fecha coincide con la fecha civil de su
        instante almacenado conserva ese instante.
      properties:
        areaAccesoId: { type: string, format: uuid }
        alcance: { $ref: "#/components/schemas/AlcancePermiso" }
        personaId: { type: string, format: uuid, nullable: true }
        unidadOrganizativaId: { type: string, format: uuid, nullable: true }
        companiaId: { type: string, format: uuid, nullable: true }
        fechaInicioVigencia:
          type: string
          format: date
          description: Fecha civil de inicio en la zona de la Compañía Principal del área (RF-083).
        fechaFinVigencia:
          type: string
          format: date
          description: >
            Fecha civil de fin (incluida completa), igual o posterior a fechaInicioVigencia (RF-083).
        estado: { type: string, enum: [ACTIVO, INACTIVO] }
        bloquesHorarios:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BloqueHorario" }
    PaginaPermisos:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PermisoAcceso" }
        total: { type: integer }
        pagina: { type: integer }
        tamañoPagina: { type: integer }
    ProblemDetails:
      type: object
      description: >
        RFC 7807/9457 (research.md §21). Único formato de error HTTP del sistema; reemplaza el
        antiguo ErrorResponse propio. "codigo" es una extensión propia (ProblemDetails.Extensions):
        código de error de negocio estable y legible por máquina, para que el frontend distinga
        casos sin parsear "detail" (texto para humanos).
      properties:
        type: { type: string, format: uri, example: "https://tools.ietf.org/html/rfc9457" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        codigo: { type: string, description: "Extensión propia: código de error de negocio estable" }
security:
  - bearerAuth: []
