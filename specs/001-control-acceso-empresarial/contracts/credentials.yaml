openapi: 3.0.3
info:
  title: Control de Acceso Empresarial — Credenciales / Fotocheck
  version: "1.0.0"
  description: >
    Asignación de credenciales/fotocheck a personas, dentro del contexto de una Compañía Principal
    (Historia 9, RF-018, RF-056, RF-057). Una persona puede tener credenciales vigentes simultáneas para
    Compañías Principales distintas (CS-016, CS-017), pero como máximo una credencial ASIGNADO activa por
    Compañía Principal (RF-057). TipoCredencial representa el tipo/diseño visual de la credencial, nunca
    una tecnología de identificación física — RFID, QR, NFC, código de barras (RF-058); no se modela ningún
    identificador físico. La eliminación es siempre baja lógica (Estado = ELIMINADO), nunca eliminación
    física del histórico. Cuando finaliza la pertenencia de la persona a su compañía, toda credencial
    ASIGNADO que dependa de ella pasa automáticamente a Estado = REVOCADA (RF-061, revocación automática en
    cascada) — distinto de DEVUELTO (devolución física voluntaria) y de ELIMINADO (baja lógica
    administrativa); el registro se conserva íntegro.
tags:
  - name: Credenciales
paths:
  /api/personas/{personaId}/credenciales:
    parameters:
      - name: personaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Credenciales]
      summary: Listar histórico de credenciales asignadas a la persona
      parameters:
        - name: companiaPrincipalId
          in: query
          description: Filtra el histórico a una única Compañía Principal
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Histórico ordenado por fecha de inicio descendente (puede incluir varias Compañías Principales)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AsignacionCredencial" }
    post:
      tags: [Credenciales]
      summary: Asignar una nueva credencial a la persona para una Compañía Principal (Estado inicial = ASIGNADO)
      description: >
        Requiere que exista un ContextoOperativoPersonaPrincipal vigente entre la persona y
        companiaPrincipalId (RF-056). La asignación NO cierra, finaliza, devuelve, elimina ni revoca
        automáticamente ninguna credencial previa: si la persona ya tiene una credencial ASIGNADO para la
        misma companiaPrincipalId cuyo período se solapa con el de la nueva asignación, la operación se
        rechaza con 409 y la credencial existente no se modifica (RF-057). Credenciales de otras Compañías
        Principales no intervienen en esa comprobación (CS-016, CS-017). DEVUELTO, ELIMINADO y REVOCADA
        solo se producen por devolución física, baja administrativa o la cascada de RF-061, respectivamente
        (Sesión 2026-09-15, decisión A).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AsignacionCredencialRequest" }
      responses:
        "201":
          description: Credencial asignada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsignacionCredencial" }
        "400":
          description: >
            companiaPrincipalId no es PRINCIPAL_MANDANTE, o no existe un contexto operativo vigente entre
            la persona y esa Principal (RF-056)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >
            Tipo de credencial INACTIVO; o el período solapa con otra asignación ASIGNADO de la misma persona
            para la misma Compañía Principal (RF-057, codigo SOLAPAMIENTO_VIGENCIA — la credencial existente
            no se modifica); o fechaHoraInicio/fechaHoraFin exceden la vigencia de la AsignacionCompania
            vigente de la persona (RF-072, codigo FUERA_DE_CONTENCION_TEMPORAL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/personas/{personaId}/credenciales/{id}/devolver:
    parameters:
      - name: personaId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Credenciales]
      summary: Marcar la credencial como DEVUELTO y cerrar su vigencia
      responses:
        "204":
          description: Credencial devuelta
        "409":
          description: La credencial no está en estado ASIGNADO
  /api/personas/{personaId}/credenciales/{id}:
    parameters:
      - name: personaId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Credenciales]
      summary: Baja lógica de la asignación (Estado = ELIMINADO); el registro histórico se conserva
      responses:
        "204":
          description: Baja lógica aplicada
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstadoCredencial:
      type: string
      enum: [ASIGNADO, DEVUELTO, ELIMINADO, REVOCADA]
      description: >
        REVOCADA es automática (RF-061): revocación en cascada al finalizar la pertenencia de la persona a
        su compañía. Distinta de DEVUELTO (devolución física voluntaria) y ELIMINADO (baja lógica
        administrativa). ASIGNADO es el único estado no terminal.
    AsignacionCredencial:
      type: object
      properties:
        id: { type: string, format: uuid }
        personaId: { type: string, format: uuid }
        companiaPrincipalId: { type: string, format: uuid }
        tipoCredencialId: { type: string, format: uuid }
        fechaHoraInicio: { type: string, format: date-time, description: Nunca se modifica tras la creación (RF-063) }
        fechaHoraFin:
          type: string
          format: date-time
          description: >
            Fin de vigencia; obligatoria desde la creación (RF-071, Sesión 2026-09-14 "vigencia temporal
            jerárquica") — ya no admite null ni fecha centinela; no existe credencial de vigencia
            indefinida. Debe estar contenida dentro de la vigencia de la AsignacionCompania vigente de la
            persona (RF-072, contención). La evaluación de acceso (RF-066) usa este campo junto a
            fechaHoraInicio, independientemente de estado, para determinar si la credencial está vigente en
            una fecha dada (research.md §24).
        estado: { $ref: "#/components/schemas/EstadoCredencial" }
        revocadoPorPertenenciaId:
          type: string
          format: uuid
          nullable: true
          description: FK a la AsignacionCompania que originó la revocación en cascada; poblado solo si estado = REVOCADA (RF-061, research.md §14.2)
    AsignacionCredencialRequest:
      type: object
      required: [companiaPrincipalId, tipoCredencialId, fechaHoraInicio, fechaHoraFin]
      description: >
        fechaHoraFin es obligatoria (RF-071) y debe quedar contenida dentro de la vigencia de la
        AsignacionCompania vigente de la persona (RF-072) — 409 si la excede.
      properties:
        companiaPrincipalId: { type: string, format: uuid }
        tipoCredencialId: { type: string, format: uuid }
        fechaHoraInicio: { type: string, format: date-time }
        fechaHoraFin: { type: string, format: date-time }
    ProblemDetails:
      type: object
      description: >
        RFC 7807/9457 (research.md §21). Único formato de error HTTP del sistema; reemplaza el
        antiguo ErrorResponse propio. "codigo" es una extensión propia (ProblemDetails.Extensions):
        código de error de negocio estable y legible por máquina, para que el frontend distinga
        casos sin parsear "detail" (texto para humanos).
      properties:
        type: { type: string, format: uri, example: "https://tools.ietf.org/html/rfc9457" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        codigo: { type: string, description: "Extensión propia: código de error de negocio estable" }
security:
  - bearerAuth: []
